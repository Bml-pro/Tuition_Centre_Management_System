<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Wambura Training Centre</title>

</head>

<body>

    <div>

        <h1>
            Wambura Training Centre
        </h1>

        <h2>
            Staff Login
        </h2>

        {% if form.errors %}
            <p>
                Username or password is incorrect.
            </p>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div>

                <label for="id_username">
                    Username
                </label>

                {{ form.username }}

            </div>

            <br>

            <div>

                <label for="id_password">
                    Password
                </label>

                {{ form.password }}

            </div>

            <br>

            <input
                type="hidden"
                name="next"
                value="{{ next }}"
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
